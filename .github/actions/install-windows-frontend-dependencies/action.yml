# screenpipe — AI that knows everything you've seen, said, or heard
# https://screenpipe.com

name: Install Windows frontend dependencies
description: Install the pinned app dependencies without requiring Windows symlink privileges.

runs:
  using: composite
  steps:
    - name: Stage the local Workflows package and install dependencies
      shell: pwsh
      working-directory: ${{ github.workspace }}/apps/screenpipe-app-tauri
      # Bun uses per-file symlinks for ../ dependencies even with copyfile.
      # Stage the exact release source inside the app, preserving its lockfile.
      run: |
        $ErrorActionPreference = 'Stop'
        $source = (Resolve-Path '../../packages/workflows-ui').Path
        $destination = Join-Path (Get-Location) 'node_modules/@screenpipe/workflows-ui'
        if (Test-Path -LiteralPath $destination) {
          $item = Get-Item -LiteralPath $destination -Force
          if ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) {
            cmd /c rmdir "$destination"
            if ($LASTEXITCODE -ne 0) { throw 'failed to remove stale local package link' }
          } else {
            Remove-Item -LiteralPath $destination -Recurse -Force
          }
        }
        $staged = Join-Path (Get-Location) '.release-workflows-ui'
        New-Item -ItemType Directory -Force -Path $staged | Out-Null
        Copy-Item -LiteralPath "$source/package.json" -Destination $staged -Force
        Copy-Item -LiteralPath "$source/src" -Destination $staged -Recurse -Force
        foreach ($file in @('package.json', 'bun.lock')) {
          $path = Join-Path (Get-Location) $file
          $text = [IO.File]::ReadAllText($path)
          if (-not $text.Contains('file:../../packages/workflows-ui')) { throw "local dependency missing from $file" }
          [IO.File]::WriteAllText($path, $text.Replace('file:../../packages/workflows-ui', 'file:./.release-workflows-ui'))
        }
        bun install --frozen-lockfile --backend=copyfile
        if ($LASTEXITCODE -ne 0) { throw 'frontend dependency installation failed' }
