name: Stage verified Screenpipe 2.7.163 macOS installers
on:
  workflow_dispatch:
    inputs:
      confirm_version:
        description: Exact version to stage
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  stage-macos:
    if: github.ref == 'refs/heads/ops/deploy-unified-release-uploader' && inputs.confirm_version == '2.7.163'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            source_job: 139610558190
          - target: x86_64-apple-darwin
            source_job: 139610558065
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 74e036322c31b28137b7e17208d48af4e66217ee
      - name: Verify the signed source artifact and check target ownership
        id: preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          SOURCE_JOB: ${{ matrix.source_job }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45730031305" |
            jq -e '.head_sha == "74e036322c31b28137b7e17208d48af4e66217ee" and .head_branch == "main" and .path == ".github/workflows/release-app.yml"'
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$SOURCE_JOB" |
            jq -e '(.run_id == 45730031305) and
              any(.steps[]; .name == "Notarize and staple DMGs (macOS)" and .conclusion == "success") and
              any(.steps[]; .name == "Upload macOS dry-run artifacts" and .conclusion == "success")'
          # The normal release owns a target once its upload starts.
          if gh api "repos/$GITHUB_REPOSITORY/actions/runs/45737460306/jobs?per_page=100" |
            jq -e --arg target "$TARGET" 'any(.jobs[]; (.name | contains($target)) and
              any(.steps[]; .name == "Upload to Cloudflare R2 (macOS)" and
                (.status == "in_progress" or .conclusion == "success")))' >/dev/null; then
            echo "stage=false" >> "$GITHUB_OUTPUT"
          else
            echo "stage=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.preflight.outputs.stage == 'true'
        with:
          name: screenpipe-macos-${{ matrix.target }}
          path: staging
          run-id: 45730031305
          github-token: ${{ github.token }}
      - name: Upload signed 2.7.163 Mac installers as versioned artifacts
        if: steps.preflight.outputs.stage == 'true'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_UPLOAD_URL: ${{ vars.RELEASE_UPLOAD_URL }}
          RELEASE_UPLOAD_TOKEN: ${{ secrets.RELEASE_UPLOAD_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmg=(staging/dmg/screenpipe_2.7.163_*.dmg)
          test "${#dmg[@]}" -eq 1
          test -s staging/macos/screenpipe.app.tar.gz
          test -s staging/macos/screenpipe.app.tar.gz.sig
          .github/scripts/upload-release-artifacts.sh consumer 2.7.163 "$TARGET" \
            apps/screenpipe-app-tauri/unified-installer.json \
            "${dmg[@]}" staging/attribution/* staging/macos/screenpipe.app.tar.gz staging/macos/screenpipe.app.tar.gz.sig
