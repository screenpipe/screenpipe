name: Deploy release artifact uploader
on:
  workflow_dispatch:
    inputs:
      confirm_worker:
        description: Exact worker name to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-release-artifact-uploader
  cancel-in-progress: false

jobs:
  deploy-uploader:
    if: github.ref == 'refs/heads/ops/deploy-unified-release-uploader' && inputs.confirm_worker == 'screenpipe-release-artifact-uploader'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: infra/release-artifact-uploader
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 74e036322c31b28137b7e17208d48af4e66217ee
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Verify release uploader and deployment bundle
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          bun test
          bunx wrangler@4.118.0 deploy --dry-run --config wrangler.jsonc
      - name: Deploy the verified release artifact uploader
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          bunx wrangler@4.118.0 deployments status --config wrangler.jsonc --json |
            jq '{id, versions}'
          bunx wrangler@4.118.0 deploy --keep-vars --config wrangler.jsonc
          bunx wrangler@4.118.0 deployments status --config wrangler.jsonc --json |
            jq '{id, versions}'
      - name: Verify the uploader still has no publication route
        run: |
          curl -fsS 'https://screenpipe-release-artifact-uploader.louis-beaumont.workers.dev/healthz' |
            jq -e '.ok == true and .publicationAccess == false'
