name: Release workflow contracts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release-app.yml
      - .github/workflows/release-enterprise.yml
      - .github/workflows/test-release-workflows.yml
      - .github/actions/install-windows-frontend-dependencies/**
      - .github/scripts/release-workflows.test.ts
      - .github/scripts/enterprise-release.cjs
      - .github/actions/setup-persistent-macos-cache/**
      - .github/actions/setup-persistent-linux-cache/**
      - .github/scripts/release-performance.test.ts
      - .github/scripts/check-macos-builder-load.py
      - apps/screenpipe-app-tauri/src-tauri/release-router-contract/**
      - .github/scripts/release-symbols.cjs
      - .github/scripts/setup-release-sccache.sh
      - .github/scripts/prepare-mlx-cache.sh
      - .github/scripts/finalize-macos-updater.sh
  push:
    branches: [main]
    paths:
      - .github/workflows/release-app.yml
      - .github/workflows/release-enterprise.yml
      - .github/workflows/test-release-workflows.yml
      - .github/actions/install-windows-frontend-dependencies/**
      - .github/scripts/release-workflows.test.ts
      - .github/scripts/enterprise-release.cjs
      - .github/actions/setup-persistent-macos-cache/**
      - .github/actions/setup-persistent-linux-cache/**
      - .github/scripts/release-performance.test.ts
      - .github/scripts/check-macos-builder-load.py
      - apps/screenpipe-app-tauri/src-tauri/release-router-contract/**
      - .github/scripts/release-symbols.cjs
      - .github/scripts/setup-release-sccache.sh
      - .github/scripts/prepare-mlx-cache.sh
      - .github/scripts/finalize-macos-updater.sh

permissions:
  contents: read

jobs:
  release-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: bun test ./.github/scripts/release-workflows.test.ts ./.github/scripts/release-performance.test.ts

  symbols:
    if: github.repository == 'screenpipe/screenpipe' && github.ref == 'refs/heads/codex/release-builder-performance'
    runs-on: screenpipe-release-macos-validation
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: .release-validation
          sparse-checkout: .github/scripts
      - name: Compare Sentry processing without uploads
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: mediar
        run: |
          set -euo pipefail
          RELEASE_DIR="$HOME/screenpipe-cache/targets/aarch64-apple-darwin/aarch64-apple-darwin/release"
          for mode in after-first before after-second; do
            echo "SYMBOLS_MODE=$mode"
            if [[ "$mode" == before ]]; then
              /usr/bin/time -p sentry-cli debug-files upload --org "$SENTRY_ORG" --project screenpipe-app --no-upload "$RELEASE_DIR"
            else
              /usr/bin/time -p node .release-validation/.github/scripts/release-symbols.cjs "$RELEASE_DIR" --no-upload
            fi
          done
