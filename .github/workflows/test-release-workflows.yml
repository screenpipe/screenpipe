name: Release workflow contracts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release-app.yml
      - .github/workflows/release-enterprise.yml
      - .github/workflows/test-release-workflows.yml
      - .github/actions/install-windows-frontend-dependencies/**
      - .github/actions/refresh-windows-signing-trust/**
      - .github/scripts/release-workflows.test.ts
      - .github/scripts/enterprise-release.cjs
      - .github/actions/prepare-desktop-localization/**
      - apps/screenpipe-app-tauri/scripts/i18n/**
      - apps/screenpipe-app-tauri/scripts/build-production.ts
      - apps/screenpipe-app-tauri/gt.config.json
      - .github/actions/setup-persistent-macos-cache/**
      - .github/actions/setup-persistent-linux-cache/**
      - .github/scripts/release-performance.test.ts
      - .github/scripts/check-macos-builder-load.py
      - apps/screenpipe-app-tauri/src-tauri/release-router-contract/**
      - .github/scripts/release-symbols.cjs
      - .github/scripts/setup-release-sccache.sh
      - .github/scripts/prepare-mlx-cache.sh
      - .github/scripts/finalize-macos-updater.sh
  push:
    branches: [main]
    paths:
      - .github/workflows/release-app.yml
      - .github/workflows/release-enterprise.yml
      - .github/workflows/test-release-workflows.yml
      - .github/actions/install-windows-frontend-dependencies/**
      - .github/actions/refresh-windows-signing-trust/**
      - .github/scripts/release-workflows.test.ts
      - .github/scripts/enterprise-release.cjs
      - .github/actions/prepare-desktop-localization/**
      - apps/screenpipe-app-tauri/scripts/i18n/**
      - apps/screenpipe-app-tauri/scripts/build-production.ts
      - apps/screenpipe-app-tauri/gt.config.json
      - .github/actions/setup-persistent-macos-cache/**
      - .github/actions/setup-persistent-linux-cache/**
      - .github/scripts/release-performance.test.ts
      - .github/scripts/check-macos-builder-load.py
      - apps/screenpipe-app-tauri/src-tauri/release-router-contract/**
      - .github/scripts/release-symbols.cjs
      - .github/scripts/setup-release-sccache.sh
      - .github/scripts/prepare-mlx-cache.sh
      - .github/scripts/finalize-macos-updater.sh

permissions:
  contents: read

jobs:
  release-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: bun test ./.github/scripts/release-workflows.test.ts ./.github/scripts/release-performance.test.ts

  localization-generation:
    if: github.event_name == 'workflow_dispatch'
    needs: release-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      snapshot-digest: ${{ steps.verify.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/prepare-desktop-localization
        with:
          release-sha: ${{ github.sha }}
          token: ${{ github.token }}
          gt-project-id: ${{ secrets.GT_PROJECT_ID }}
          gt-api-key: ${{ secrets.GT_API_KEY }}
      - name: Require complete, valid translations
        id: verify
        working-directory: apps/screenpipe-app-tauri
        run: |
          bun - <<'JS'
            import assert from "node:assert/strict";
            import { appendFileSync, readFileSync } from "node:fs";
            import { createHash } from "node:crypto";
            import { verifySnapshot } from "./scripts/i18n/prepare.mjs";
            const bytes = readFileSync("../../.release-localization/snapshot.json");
            const snapshot = verifySnapshot(JSON.parse(bytes));
            assert.equal(snapshot.mode, "generate");
            assert(snapshot.locales.length > 0, "No bundled languages");
            assert.deepEqual(snapshot.causes, [], "Translation service did not complete cleanly");
            for (const locale of snapshot.locales) {
              for (const surface of ["frontend", "native"]) {
                const coverage = snapshot.coverage[locale][surface];
                assert(coverage.total > 0, `${locale}: no ${surface} messages`);
                assert.equal(coverage.translated, coverage.total, `${locale}: incomplete ${surface}`);
                assert.equal(coverage.fallback, 0, `${locale}: ${surface} fallbacks`);
              }
              assert.deepEqual(snapshot.fallbacks[locale], {}, `${locale}: invalid translations`);
            }
            appendFileSync(process.env.GITHUB_OUTPUT, `digest=${createHash("sha256").update(bytes).digest("hex")}\n`);
            console.log(JSON.stringify({ revision: snapshot.revision, coverage: snapshot.coverage }));
          JS

  localization-handoff:
    if: github.event_name == 'workflow_dispatch'
    needs: localization-generation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      # Exercise the enterprise handoff on a clean worker with no GT credentials.
      - uses: ./.github/actions/prepare-desktop-localization
        with:
          release-sha: ${{ github.sha }}
          source-run-id: ${{ github.run_id }}
          token: ${{ github.token }}
      - name: Verify byte-identical offline handoff
        env:
          EXPECTED_DIGEST: ${{ needs.localization-generation.outputs.snapshot-digest }}
        run: |
          echo "$EXPECTED_DIGEST  .release-localization/snapshot.json" | sha256sum --check

  windows-signing-trust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download the release signing tool without credentials
        shell: pwsh
        run: |
          $tool = Join-Path $env:RUNNER_TEMP 'CodeSignTool'
          $zip = Join-Path $env:RUNNER_TEMP 'codesigntool.zip'
          Invoke-WebRequest -Uri 'https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.2/CodeSignTool-v1.3.2-windows.zip' -OutFile $zip -TimeoutSec 120
          Expand-Archive -LiteralPath $zip -DestinationPath $tool -Force
          "CODESIGNTOOL_PATH=$tool" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: ./.github/actions/refresh-windows-signing-trust

  windows-frontend-dependencies:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Reproduce the persistent runner's removed updater package
        shell: pwsh
        working-directory: apps/screenpipe-app-tauri
        run: |
          $orphan = 'node_modules/@tauri-apps/plugin-updater'
          New-Item -ItemType Directory -Force -Path $orphan | Out-Null
          Set-Content -LiteralPath "$orphan/package.json" -Value '{"name":"@tauri-apps/plugin-updater","version":"2.10.0"}'
      - uses: ./.github/actions/install-windows-frontend-dependencies
      - name: Verify the installed tree matches the release dependencies
        shell: pwsh
        working-directory: apps/screenpipe-app-tauri
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath 'node_modules/@tauri-apps/plugin-updater') {
            throw 'removed updater package survived the release install'
          }
          if (-not (Test-Path -LiteralPath 'node_modules/@tauri-apps/cli/package.json')) {
            throw 'Tauri CLI was not installed'
          }
          $source = '../../packages/workflows-ui/src'
          $installed = 'node_modules/@screenpipe/workflows-ui/src'
          foreach ($file in Get-ChildItem -LiteralPath $source -Recurse -File) {
            $relative = [IO.Path]::GetRelativePath((Resolve-Path $source), $file.FullName)
            $copy = Get-Item -LiteralPath (Join-Path $installed $relative)
            if ($copy.Attributes -band [IO.FileAttributes]::ReparsePoint) {
              throw "local dependency uses a symlink: $relative"
            }
            if ((Get-FileHash $copy.FullName).Hash -ne (Get-FileHash $file.FullName).Hash) {
              throw "local dependency differs from release source: $relative"
            }
          }
