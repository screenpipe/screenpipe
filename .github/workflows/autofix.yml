# https://screenpipe.com

name: autofix.ci

on:
  pull_request:
    paths:
      - '**/*.rs'
      - '**/package.json'
      - '**/Cargo.toml'
      - 'rustfmt.toml'
      - 'rust-toolchain.toml'
      - '.github/dependabot.yml'
      - '.github/scripts/dependabot-lockfiles*'
      - '.github/workflows/autofix.yml'

permissions:
  contents: read

env:
  GIT_LFS_SKIP_SMUDGE: 1

jobs:
  verify-lockfiles:
    name: Verify Dependabot lockfile repairs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.2
      - uses: dtolnay/rust-toolchain@stable
      - run: bun test ./.github/scripts/dependabot-lockfiles.test.ts

  lockfiles:
    name: Repair Dependabot lockfiles
    needs: verify-lockfiles
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.2

      - uses: dtolnay/rust-toolchain@stable

      - name: Refresh dependent lockfiles
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/dependabot-lockfiles.sh "$PR_BASE_SHA"

      # Reuse the installed app: no write token, repository secret, or merge.
      # autofix.ci requires this workflow name and retriggers CI on its commit.
      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a
        with:
          commit-message: "fix(deps): synchronize Dependabot lockfiles"

  autofix:
    # Keep a single autofix patch per PR; Dependabot uses the lockfile job above.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          rustflags: ""

      - name: Format Rust
        run: cargo fmt --all

      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a
