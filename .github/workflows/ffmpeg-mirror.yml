name: Notarize FFmpeg mirror archives

on:
  push:
    branches: [release/ffmpeg-mirror]
    paths:
      - scripts/ffmpeg-mirror/notarize-macos.sh
      - .github/workflows/ffmpeg-mirror.yml
  workflow_dispatch:

concurrency:
  group: ffmpeg-mirror-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  notarize:
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      # GitHub requires push access to read draft release assets.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download private staging artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ffmpeg-mirror-staging-8.1.3 --repo "${{ github.repository }}" --dir mirror-input
          cd mirror-input
          shasum -a 256 -c SHA256SUMS
      - name: Notarize both macOS archives
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          bash scripts/ffmpeg-mirror/notarize-macos.sh mirror-input notarization
          cp mirror-input/SHA256SUMS notarization/
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-mirror-notarization
          path: notarization/
          if-no-files-found: error
