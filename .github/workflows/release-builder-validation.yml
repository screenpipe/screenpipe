name: Release builder validation
on: workflow_dispatch
permissions:
  contents: read
jobs:
  symbols:
    if: github.repository == 'screenpipe/screenpipe' && github.ref == 'refs/heads/codex/release-builder-performance'
    runs-on: screenpipe-release-macos-validation
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: .release-validation
          sparse-checkout: .github/scripts
      - name: Compare Sentry processing without uploads
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: mediar
        run: |
          set -euo pipefail
          RELEASE_DIR="$HOME/screenpipe-cache/targets/aarch64-apple-darwin/aarch64-apple-darwin/release"
          for mode in after-first before after-second; do
            echo "SYMBOLS_MODE=$mode"
            if [[ "$mode" == before ]]; then
              /usr/bin/time -p sentry-cli debug-files upload --org "$SENTRY_ORG" --project screenpipe-app --no-upload "$RELEASE_DIR"
            else
              /usr/bin/time -p node .release-validation/.github/scripts/release-symbols.cjs "$RELEASE_DIR" --no-upload
            fi
          done
