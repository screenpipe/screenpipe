<svg width="1440" height="1120" viewBox="0 0 1440 1120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1440" height="1120" rx="28" fill="#F6F4EF"/>
  <text x="64" y="86" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="700" fill="#171717">Background Pipe allowance warning states</text>
  <text x="64" y="126" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" fill="#69645D">Representative screenshots for PR #6582. The gateway owns the advisory; the desktop only throttles and posts local /notify.</text>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <style>
      .ui { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif; }
      .label { font-size: 15px; fill: #6B665F; }
      .title { font-size: 20px; font-weight: 700; fill: #171717; }
      .body { font-size: 16px; fill: #3E3A35; }
      .small { font-size: 13px; fill: #766F66; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <g transform="translate(64 168)">
    <rect width="620" height="204" rx="22" fill="#FFFFFF" filter="url(#shadow)"/>
    <rect x="24" y="24" width="104" height="32" rx="16" fill="#E7F4EA"/>
    <text class="ui label" x="42" y="45" fill="#1D6B37">state 1</text>
    <text class="ui title" x="24" y="88">Usage unknown or gateway unavailable</text>
    <text class="ui body" x="24" y="124">No notification appears. The app does not fabricate a zero balance or warn from missing data.</text>
    <rect x="24" y="152" width="268" height="30" rx="15" fill="#F3F0EA"/>
    <text class="ui small mono" x="42" y="172">background_pipe_advisory: null</text>
  </g>

  <g transform="translate(756 168)">
    <rect width="620" height="204" rx="22" fill="#FFFFFF" filter="url(#shadow)"/>
    <rect x="24" y="24" width="104" height="32" rx="16" fill="#E7F4EA"/>
    <text class="ui label" x="42" y="45" fill="#1D6B37">state 2</text>
    <text class="ui title" x="24" y="88">Allowance healthy</text>
    <text class="ui body" x="24" y="124">No notification. Settings and usage surfaces can still show allowance details normally.</text>
    <rect x="24" y="152" width="226" height="30" rx="15" fill="#F3F0EA"/>
    <text class="ui small mono" x="42" y="172">remaining_percent &gt; threshold</text>
  </g>

  <g transform="translate(64 424)">
    <rect width="620" height="204" rx="22" fill="#FFFFFF" filter="url(#shadow)"/>
    <rect x="24" y="24" width="104" height="32" rx="16" fill="#FEF3C7"/>
    <text class="ui label" x="42" y="45" fill="#8A5A00">state 3</text>
    <text class="ui title" x="24" y="88">Allowance low, but reset is soon</text>
    <text class="ui body" x="24" y="124">No proactive nudge. The user can wait out the reset instead of getting noisy warnings.</text>
    <rect x="24" y="152" width="342" height="30" rx="15" fill="#F3F0EA"/>
    <text class="ui small mono" x="42" y="172">hours_until_reset &lt; min reset window</text>
  </g>

  <g transform="translate(756 424)">
    <rect width="620" height="280" rx="22" fill="#FFFFFF" filter="url(#shadow)"/>
    <rect x="24" y="24" width="104" height="32" rx="16" fill="#FFE4D6"/>
    <text class="ui label" x="42" y="45" fill="#A13B11">state 4</text>
    <text class="ui title" x="24" y="88">Allowance low and reset is far away</text>
    <text class="ui body" x="24" y="124">The app posts one local /notify. It is normal priority and points the user to scheduled tasks.</text>

    <g transform="translate(24 150)">
      <rect width="540" height="104" rx="18" fill="#FCFBF8" stroke="#DDD6CC"/>
      <circle cx="30" cy="32" r="13" fill="#F97316"/>
      <path d="M30 23L39 39H21L30 23Z" fill="#FFF7ED"/>
      <text class="ui" x="58" y="36" font-size="18" font-weight="700" fill="#171717">Background Pipes are using most of your AI allowance</text>
      <text class="ui small" x="58" y="62">Background Pipes have about 12% of the allowance left; reset is days away.</text>
      <rect x="58" y="76" width="150" height="22" rx="11" fill="#171717"/>
      <text class="ui small" x="76" y="91" fill="#FFFFFF">review scheduled tasks</text>
      <text class="ui small" x="224" y="91">dismiss</text>
    </g>
  </g>

  <g transform="translate(64 760)">
    <rect width="620" height="204" rx="22" fill="#FFFFFF" filter="url(#shadow)"/>
    <rect x="24" y="24" width="104" height="32" rx="16" fill="#E9E5FF"/>
    <text class="ui label" x="42" y="45" fill="#5742A6">state 5</text>
    <text class="ui title" x="24" y="88">Same advisory inside cooldown</text>
    <text class="ui body" x="24" y="124">No duplicate notification. The app stores a local per-window timestamp keyed by advisory ID.</text>
    <rect x="24" y="152" width="340" height="30" rx="15" fill="#F3F0EA"/>
    <text class="ui small mono" x="42" y="172">notification_id still cooling down</text>
  </g>

  <g transform="translate(756 760)">
    <rect width="620" height="204" rx="22" fill="#FFFFFF" filter="url(#shadow)"/>
    <rect x="24" y="24" width="104" height="32" rx="16" fill="#E7F4EA"/>
    <text class="ui label" x="42" y="45" fill="#1D6B37">state 6</text>
    <text class="ui title" x="24" y="88">Interactive chat and frontier-only limits</text>
    <text class="ui body" x="24" y="124">No background-pipe nudge. Existing chat/usage UI remains responsible for interactive and frontier-only cases.</text>
    <rect x="24" y="152" width="320" height="30" rx="15" fill="#F3F0EA"/>
    <text class="ui small mono" x="42" y="172">lane = frontier only → ignored here</text>
  </g>

  <text class="ui small" x="64" y="1050">Representative only: this PR adds the gateway advisory, desktop parser, and throttled local /notify sender. It does not change allowance policy or production config.</text>
</svg>
